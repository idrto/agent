# Build agent artifacts on every push to `e2e`.
#
# Target (desktop only): Linux, Windows, macOS  →  target-agent (+ webrtc)
# Source (all platforms):
#   Desktop (Linux / Windows / macOS)  →  source-agent + libidr_c_api
#   Android                            →  libidr_c_api.so (arm64-v8a, armeabi-v7a, x86_64)
#   iOS                                →  libidr_c_api.a (device + simulator)
#
# Published as a private rolling GitHub Release tag `e2e-latest`
# (single zip: e2e-agent-binaries.zip). Same-repo GITHUB_TOKEN can
# create the release. The other private app needs a PAT/org secret
# with `contents: read` on idrto/agent — see job summary.

name: e2e binaries

on:
  push:
    branches: [e2e]
  workflow_dispatch:

concurrency:
  group: e2e-binaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent

      - name: Checkout sibling crates
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
        run: bash agent/scripts/ci-clone-siblings.sh agent

      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libssl-dev

      - name: Install native deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openssl@3
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          # openssl@3 is keg-only; cmake uses OPENSSL_ROOT_DIR, but the final
          # rustc link of libidr_c_api.dylib still needs -L (ld: library 'ssl'
          # not found). LIBRARY_PATH is picked up by Apple clang/ld.
          {
            echo "OPENSSL_ROOT_DIR=${OPENSSL_PREFIX}"
            echo "OPENSSL_DIR=${OPENSSL_PREFIX}"
            echo "OPENSSL_LIBRARIES=${OPENSSL_PREFIX}/lib"
            echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig"
            echo "LIBRARY_PATH=${OPENSSL_PREFIX}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}"
            echo "CARGO_BUILD_RUSTFLAGS=-Lnative=${OPENSSL_PREFIX}/lib"
          } >> "${GITHUB_ENV}"

      - name: Install native deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install openssl --no-progress
          $root = "C:\Program Files\OpenSSL-Win64"
          if (-not (Test-Path $root)) { $root = "C:\Program Files\OpenSSL" }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_ROOT_DIR=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_DIR=$root"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          shared-key: e2e-desktop-${{ matrix.name }}
          prefix-key: v0-libdatachannel

      - name: Build Source (CLI)
        working-directory: agent
        run: cargo build -p source-agent --release

      - name: Build Source (C ABI, native WebRTC)
        working-directory: agent
        run: cargo build -p idr-c-api --release --features native

      - name: Build Target (desktop WebRTC)
        working-directory: agent
        run: cargo build -p target-agent --release --features webrtc

      - name: Stage desktop artifacts
        working-directory: agent
        run: bash scripts/ci-stage-desktop.sh ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-part-${{ matrix.name }}
          path: agent/dist
          if-no-files-found: error
          retention-days: 7

  source-android:
    name: source android
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent

      - name: Checkout sibling crates
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
        run: bash agent/scripts/ci-clone-siblings.sh agent

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          shared-key: e2e-source-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Source C ABI (Android)
        working-directory: agent
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -P 24 \
            -o dist/source/android \
            build -p idr-c-api --release --features native
          cp crates/idr-c-api/include/idr.h dist/source/android/
          find dist/source/android -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-part-android
          path: agent/dist
          if-no-files-found: error
          retention-days: 7

  source-ios:
    name: source ios
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent

      - name: Checkout sibling crates
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
        run: bash agent/scripts/ci-clone-siblings.sh agent

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          shared-key: e2e-source-ios

      - name: Build Source C ABI (iOS device)
        working-directory: agent
        run: cargo build -p idr-c-api --release --target aarch64-apple-ios

      - name: Build Source C ABI (iOS simulator)
        working-directory: agent
        run: cargo build -p idr-c-api --release --target aarch64-apple-ios-sim

      - name: Stage iOS artifacts
        working-directory: agent
        run: |
          set -euo pipefail
          mkdir -p dist/source/ios/aarch64-apple-ios dist/source/ios/aarch64-apple-ios-sim
          cp -v target/aarch64-apple-ios/release/libidr_c_api.a dist/source/ios/aarch64-apple-ios/
          cp -v target/aarch64-apple-ios-sim/release/libidr_c_api.a dist/source/ios/aarch64-apple-ios-sim/
          cp -v crates/idr-c-api/include/idr.h dist/source/ios/
          find dist/source/ios -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-part-ios
          path: agent/dist
          if-no-files-found: error
          retention-days: 7

  package:
    name: package artifacts
    needs: [desktop, source-android, source-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-part-*
          path: dist
          merge-multiple: true

      - name: Write metadata and checksums
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > dist/GIT_SHA
          printf '%s\n' "${GITHUB_REF_NAME}" > dist/GIT_REF
          printf '%s\n' \
            'target/  desktop Target only (linux / windows / macos)' \
            'source/  Source on every platform (desktop CLI+FFI, android/ios C ABI)' \
            > dist/LAYOUT.txt
          (cd dist && find . -type f ! -name SHA256SUMS | sort | xargs sha256sum | tee SHA256SUMS)
          echo "=== tree ==="
          find dist -print | sort

      - name: Zip binaries
        run: |
          set -euo pipefail
          (cd dist && zip -r ../e2e-agent-binaries.zip .)
          ls -lh e2e-agent-binaries.zip

      - name: Publish private rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This job never checks out the repo; gh must not infer origin from .git.
          repo="${GITHUB_REPOSITORY}"
          notes="Rolling e2e binaries from ${GITHUB_SHA}"
          if gh release view e2e-latest --repo "${repo}" >/dev/null 2>&1; then
            gh release upload e2e-latest e2e-agent-binaries.zip --repo "${repo}" --clobber
            gh release edit e2e-latest --repo "${repo}" --target "${GITHUB_SHA}" --notes "${notes}"
          else
            gh release create e2e-latest e2e-agent-binaries.zip \
              --repo "${repo}" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "e2e agent binaries" \
              --notes "${notes}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-agent-binaries
          path: e2e-agent-binaries.zip
          if-no-files-found: error
          retention-days: 14

      - name: job summary
        run: |
          {
            echo "## e2e agent binaries"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- private release: \`e2e-latest\` / \`e2e-agent-binaries.zip\`"
            echo
            echo "### Fetch from another private app"
            echo '```'
            echo 'gh release download e2e-latest --repo idrto/agent -p e2e-agent-binaries.zip'
            echo 'unzip e2e-agent-binaries.zip'
            echo '```'
            echo
            echo "Local: \`gh auth login\` as an org member (no extra token)."
            echo "CI in another private repo: org secret PAT with Contents: Read on idrto/agent, then GH_TOKEN that secret."
            echo
            echo "### Target (desktop only)"
            echo "- \`target/linux-x64/target-agent\`"
            echo "- \`target/windows-x64/target-agent.exe\`"
            echo "- \`target/macos-arm64/target-agent\`"
            echo
            echo "### Source (all platforms)"
            echo "- desktop: \`source/{linux-x64,windows-x64,macos-arm64}/\` (\`source-agent\` + \`libidr_c_api\`)"
            echo "- android: \`source/android/{arm64-v8a,armeabi-v7a,x86_64}/libidr_c_api.so\`"
            echo "- ios: \`source/ios/{aarch64-apple-ios,aarch64-apple-ios-sim}/libidr_c_api.a\`"
          } >> "${GITHUB_STEP_SUMMARY}"
