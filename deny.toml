[advisories]
# cargo-deny no longer accepts lint levels for unmaintained.
# Previous value was "warn" (report, do not fail). Closest equivalent is
# "none" — unmaintained crates are not treated as errors.
unmaintained = "none"
yanked = "warn"

[licenses]
# The LLVM exception only adds permissions to Apache-2.0 (needed by winx, via cap-std on Windows).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
