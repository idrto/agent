[package]
name = "idr-webrtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WebRTC PeerTransport abstraction (libdatachannel-agnostic)"
repository.workspace = true

[features]
default = []
native = ["dep:datachannel", "dep:idr-protocol", "dep:serde_json", "dep:tracing"]

[dependencies]
idr-core = { workspace = true }
async-trait = "0.1"
bytes = { workspace = true }
tokio = { workspace = true }
idr-protocol = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dependencies.datachannel]
# Repo-root clone: c:\dev\idrto\datachannel-rs (not crates.io).
path = "../../../datachannel-rs"
default-features = false
# vendored-libdatachannel: build libdatachannel from source; use system OpenSSL
# (OPENSSL_ROOT_DIR). Avoids openssl-src + broken Git Perl on Windows.
features = ["tracing", "vendored-libdatachannel"]
optional = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
