[package]
name = "idr-webrtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WebRTC PeerTransport abstraction (libdatachannel-agnostic)"
repository.workspace = true

[features]
default = []
native = ["dep:datachannel", "dep:idr-protocol", "dep:serde_json", "dep:tracing"]

[dependencies]
idr-core = { workspace = true }
async-trait = "0.1"
bytes = { workspace = true }
tokio = { workspace = true }
idr-protocol = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# Desktop: system OpenSSL (OPENSSL_ROOT_DIR). Avoids openssl-src + Git Perl on Windows.
[target.'cfg(not(target_os = "android"))'.dependencies.datachannel]
git = "https://github.com/idrto/datachannel-rs.git"
branch = "fix/raw-sdp-forward"
default-features = false
features = ["tracing", "vendored-libdatachannel"]
optional = true

# Android: openssl-src (host OpenSSL is the wrong ABI).
[target.'cfg(target_os = "android")'.dependencies.datachannel]
git = "https://github.com/idrto/datachannel-rs.git"
branch = "fix/raw-sdp-forward"
default-features = false
features = ["tracing", "vendored"]
optional = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
