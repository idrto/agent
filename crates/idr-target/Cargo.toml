[package]
name = "idr-target"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "IDR Target Agent library — Presence, Relay QUIC, tunnels, ACME, WebRTC answerer"
repository.workspace = true

[features]
default = []
webrtc = ["dep:datachannel"]

[dependencies]
idr-protocol = { workspace = true }
idr-core = { workspace = true, features = ["net"] }
idr-dp = { workspace = true }
idr-transfer = { workspace = true, features = ["native"] }
anyhow = { workspace = true }
async-trait = "0.1"
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
postcard = { workspace = true }
prometheus = { workspace = true }
quinn = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs", "signal", "process"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
instant-acme = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }

[dependencies.datachannel]
git = "https://github.com/idrto/datachannel-rs.git"
branch = "fix/raw-sdp-forward"
default-features = false
# vendored-libdatachannel: build libdatachannel from source; use system OpenSSL
# (OPENSSL_ROOT_DIR). Avoids openssl-src + broken Git Perl on Windows.
features = ["tracing", "vendored-libdatachannel"]
optional = true

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
# Real-WebRTC loopback harness (tests/mux_loopback.rs).
idr-source = { workspace = true }
idr-signaling = { workspace = true }
idr-webrtc = { workspace = true, features = ["native"] }
cap-std = "3"
sha2 = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# Peak memory of the 100k-entry test.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[test]]
name = "mux_loopback"
required-features = ["webrtc"]

[[test]]
name = "transfer_loopback"
required-features = ["webrtc"]

[[bench]]
name = "relay_table"
harness = false
path = "../../benches/relay_table.rs"

[[bench]]
name = "signaling_dedup"
harness = false
path = "../../benches/signaling_dedup.rs"

[[bench]]
name = "idle_scheduler"
harness = false
path = "../../benches/idle_scheduler.rs"
