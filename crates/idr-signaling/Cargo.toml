[package]
name = "idr-signaling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Presence discovery and ephemeral WebRTC signaling client (Source-safe)"
repository.workspace = true

[features]
default = ["native"]
# HTTP discovery + PepClient (QUIC/WSS) + optional PresenceQuicSignalingClient.
native = [
    "dep:quinn",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio-tungstenite",
    "dep:webpki-roots",
    "dep:ed25519-dalek",
    "dep:base64",
    "dep:chrono",
    "dep:futures",
    "dep:idr-dp",
]
# Enables PresenceQuicSignalingClient (requires native).
quic = ["native"]

[dependencies]
idr-core = { workspace = true } # traits only; no TCP net for browser WASM
idr-protocol = { workspace = true }
idr-dp = { workspace = true, optional = true }
async-trait = "0.1"
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { workspace = true, optional = true }
tracing = { workspace = true }
uuid = { workspace = true }
webpki-roots = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
chrono = { workspace = true }
