[package]
name = "idr-telemetry"
version.workspace = true
edition.workspace = true
# std File::try_lock (1.89) and LazyLock (1.80).
rust-version = "1.89"
license.workspace = true
description = "IDR unified logging, tracing and diagnostics (idr.log/1). See docs/observability."
repository.workspace = true

[features]
default = ["types"]
# IDs, trace context, ctx_json, Secret<T>, field names are always available (no feature).
# Redaction (regex) for anything that formats free text. No subscriber dependencies.
types = ["redact"]
redact = ["dep:regex"]
# init, tracing layer, sinks, flight recorder, crash capture. Composition points only.
subscriber = ["types", "dep:tracing", "dep:tracing-subscriber", "dep:chrono", "dep:libc", "dep:windows-sys"]

[dependencies]
rand = { workspace = true }
regex = { version = "1", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

chrono = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

[[example]]
name = "sample"
required-features = ["subscriber"]
