[package]
name = "idr-source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Minimal mobile-first IDR Source Agent (WebRTC-only, no Relay)"
repository.workspace = true

[features]
default = ["dp", "native-signaling"]
# Delegate Permissions machine identity (desktop/mobile). Off for browser WASM.
dp = ["dep:idr-dp", "dep:ed25519-dalek", "dep:base64", "dep:chrono"]
# Presence HTTP/QUIC/WSS client stack (off for browser WASM).
native-signaling = ["idr-signaling/native"]
# Agent-owned file transfer (`agent::Daemon`): supervisor, binding, outbox. Native only.
transfer = ["dep:idr-transfer", "dep:anyhow"]

[dependencies]
idr-core = { workspace = true }
idr-protocol = { workspace = true }
idr-signaling = { workspace = true } # no native; traits + placement only
idr-webrtc = { workspace = true }
idr-dp = { workspace = true, optional = true }
# Source proof signing (dp): device key → session request proof.
ed25519-dalek = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
async-trait = "0.1"
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
idr-transfer = { workspace = true, features = ["native"], optional = true }
anyhow = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasmtimer = { version = "0.4", default-features = false, features = ["tokio"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
idr-signaling = { workspace = true, features = ["native"] }
idr-webrtc = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
