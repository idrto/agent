[package]
name = "idr-transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "IDR file transfer engine: manifest, state machine, chunking, hashing, resume"
repository.workspace = true

[features]
default = []
# Native filesystem storage (cap-std sandboxed dirs, SQLite journal). Off for WASM.
native = ["dep:cap-std", "dep:cap-fs-ext", "dep:rusqlite", "dep:rustix", "dep:windows-sys", "dep:serde_json", "tokio/net", "tokio/io-util"]

[dependencies]
idr-core = { workspace = true }
unicode-normalization = "0.1"
cap-std = { version = "3", optional = true }
cap-fs-ext = { version = "3", optional = true }
rusqlite = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
idr-protocol = { workspace = true }
async-trait = "0.1"
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Wdk_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "test-util"] }
async-trait = "0.1"

[[test]]
name = "native"
required-features = ["native"]

[[example]]
name = "ipc_stub"
required-features = ["native"]
