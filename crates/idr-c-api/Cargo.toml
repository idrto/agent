[package]
name = "idr-c-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Stable C ABI for the IDR Source Agent (mobile FFI)"
repository.workspace = true

[lib]
name = "idr_c_api"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[features]
default = ["mock"]
# In-process mock signaling + peer for CI / Dart integration without libdatachannel.
mock = []

[dependencies]
async-trait = "0.1"
idr-core = { workspace = true }
idr-protocol = { workspace = true }
idr-signaling = { workspace = true }
idr-source = { workspace = true }
idr-webrtc = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
